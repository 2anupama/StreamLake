name: streamlake

services:
  postgres:
    image: postgres:16.4
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-streamlake_source}
      POSTGRES_USER: ${POSTGRES_USER:-streamlake}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-streamlake_local_only}
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_wal_senders=10
      - -c
      - max_replication_slots=10
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  kafka:
    image: apache/kafka:4.0.1
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    ports:
      - "29092:29092"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  kafka-topics:
    image: apache/kafka:4.0.1
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "/scripts/create_topics.sh"]
    volumes:
      - ./docker/kafka/create_topics.sh:/scripts/create_topics.sh:ro
    restart: "no"

  connect:
    image: quay.io/debezium/connect:3.2@sha256:bb7a4e3e44afe245fbb5b84b2acb3d8f29cceb9d6ab97d84d32311c7b167126c
    depends_on:
      postgres:
        condition: service_healthy
      kafka-topics:
        condition: service_completed_successfully
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: streamlake-connect
      CONFIG_STORAGE_TOPIC: connect_configs
      OFFSET_STORAGE_TOPIC: connect_offsets
      STATUS_STORAGE_TOPIC: connect_statuses
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      VALUE_CONVERTER_SCHEMAS_ENABLE: "true"
      KAFKA_CONNECT_PLUGINS_DIR: /kafka/connect
    ports:
      - "8083:8083"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8083/connectors >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  spark-consumer:
    profiles: ["streaming"]
    build:
      context: .
      dockerfile: docker/spark/Dockerfile
    depends_on:
      connect:
        condition: service_healthy
    environment:
      PYTHONPATH: /opt/streamlake/src
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      CDC_BRONZE_PATH: /opt/streamlake/data/bronze/cdc_v2
      CDC_STAGING_PATH: /opt/streamlake/data/staging/cdc_v2
      CDC_SILVER_PATH: /opt/streamlake/data/silver/cdc_employee_current_v2.parquet
      CDC_QUARANTINE_PATH: /opt/streamlake/data/quarantine/cdc_v2
      CDC_CHECKPOINT_PATH: /opt/streamlake/data/checkpoints/cdc_v2
      CDC_DUCKDB_PATH: /opt/streamlake/data/streamlake_cdc_v2.duckdb
      CDC_STARTING_OFFSETS: ${CDC_STARTING_OFFSETS:-earliest}
      CDC_QUERY_NAME: ${CDC_QUERY_NAME:-employee-cdc}
    volumes:
      - .:/opt/streamlake
    command:
      - /opt/spark/bin/spark-submit
      - --packages
      - org.apache.spark:spark-sql-kafka-0-10_2.13:4.0.1
      - src/streamlake/ingestion/streaming/spark_consumer.py
    restart: unless-stopped

volumes:
  postgres_data:
  kafka_data:
