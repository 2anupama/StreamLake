name: streamlake-airflow

x-airflow-common: &airflow-common
  image: streamlake-airflow:3.4.0
  build:
    context: .
    dockerfile: Dockerfile.airflow
  environment: &airflow-environment
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__PARALLELISM: "4"
    AIRFLOW__CORE__LOAD_EXAMPLES: "False"
    AIRFLOW__API__SECRET_KEY: ${STREAMLAKE_AIRFLOW_API_SECRET_KEY:-streamlake-local-airflow-api-secret-key-change-before-sharing-2026}
    AIRFLOW__API_AUTH__JWT_SECRET: ${STREAMLAKE_AIRFLOW_JWT_SECRET:-streamlake-local-airflow-jwt-secret-change-before-sharing-2026}
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: airflow:admin
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE: /opt/airflow/config/simple_auth_manager_passwords.json.generated
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-api-server:8080/execution/
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow_local_only@airflow-postgres/airflow
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "True"
    AIRFLOW__LOGGING__BASE_LOG_FOLDER: /opt/airflow/logs
    STREAMLAKE_ROOT: /opt/streamlake
    PYTHONPATH: /opt/streamlake/src
    STREAMLAKE_BATCH_SCHEDULE: ${STREAMLAKE_BATCH_SCHEDULE:-0 2 * * *}
    _PIP_ADDITIONAL_REQUIREMENTS: ""
  volumes:
    - ./:/opt/streamlake
    - ./airflow/dags:/opt/airflow/dags:ro
    - ./airflow/logs:/opt/airflow/logs
    - ./airflow/config:/opt/airflow/config
    - ./airflow/plugins:/opt/airflow/plugins:ro
  user: "50000:0"
  depends_on:
    airflow-postgres:
      condition: service_healthy
    airflow-init:
      condition: service_completed_successfully
  restart: unless-stopped

services:
  airflow-postgres:
    image: postgres:16.4
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow_local_only
      POSTGRES_DB: airflow
    volumes:
      - airflow_metadata_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  airflow-init:
    <<: *airflow-common
    user: "0:0"
    entrypoint: /bin/bash
    command:
      - -c
      - >-
        mkdir -p /opt/airflow/logs /opt/airflow/config /opt/airflow/plugins
        && chown -R 50000:0 /opt/airflow/logs /opt/airflow/config
        && exec airflow db migrate
    depends_on:
      airflow-postgres:
        condition: service_healthy
    restart: "no"

  airflow-api-server:
    <<: *airflow-common
    command: api-server
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://localhost:8080/api/v2/monitor/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type SchedulerJob --hostname \"$$HOSTNAME\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type DagProcessorJob --hostname \"$$HOSTNAME\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

volumes:
  airflow_metadata_data:
